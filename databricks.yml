bundle:
  name: gnss-observatory-lake

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    path: .
    build: uv build --wheel

variables:
  source_path:
    description: Station-day Parquet file; supply it explicitly when running the job.
    default: ""
  output_table:
    description: Fully qualified Delta table name for profile summaries.
    default: workspace.monitoring.source_profile
  station:
    description: GNSS station identifier; supply it explicitly when running the job.
    default: ""
  year:
    description: Observation year; supply it explicitly when running the job.
    default: ""
  doy:
    description: Observation day of year; supply it explicitly when running the job.
    default: ""

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
