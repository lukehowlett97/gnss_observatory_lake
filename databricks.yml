bundle:
  name: gnss-observatory-lake

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    path: .
    build: python -m build --wheel

variables:
  source_path:
    description: Default Parquet path for a station-day profile run.
    default: /Volumes/workspace/default/gnss_source
  output_table:
    description: Two- or three-part Delta table name for profile summaries.
    default: monitoring.source_profile
  station:
    description: Default GNSS station identifier.
    default: UNKNOWN
  year:
    description: Default observation year.
    default: "2026"
  doy:
    description: Default observation day of year.
    default: "1"

sync:
  include:
    - notebooks/**

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
