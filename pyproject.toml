[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnss_observatory_lake"
version = "0.1.1"
description = "Databricks lakehouse jobs for GNSS observatory data"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
profile_source_station_day = "gnss_observatory_lake.jobs.profile_source_station_day:main"

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "build>=1.2",
  "pyspark>=3.5,<5",
  "pytest>=8.0",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
