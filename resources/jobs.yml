resources:
  schemas:
    monitoring:
      name: monitoring
      catalog_name: workspace
      comment: Managed by the gnss-observatory-lake development bundle.

  jobs:
    profile_source_station_day:
      name: profile_source_station_day
      description: Profile one GNSS station-day Parquet source into a Delta table.
      queue:
        enabled: true
      parameters:
        - name: source_path
          default: ${var.source_path}
        - name: station
          default: ${var.station}
        - name: year
          default: ${var.year}
        - name: doy
          default: ${var.doy}
        - name: output_table
          default: ${var.output_table}
      tasks:
        - task_key: profile_source_station_day
          python_wheel_task:
            package_name: gnss_observatory_lake
            entry_point: profile_source_station_day
            named_parameters:
              source_path: "{{job.parameters.source_path}}"
              station: "{{job.parameters.station}}"
              year: "{{job.parameters.year}}"
              doy: "{{job.parameters.doy}}"
              output_table: "{{job.parameters.output_table}}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
